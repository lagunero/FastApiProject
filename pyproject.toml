[project]
name = "fastapiproject"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy==2.1.6",
    "httpx==0.28.1",
]

# PEP 621: expose simple console entry points for common tasks
[project.scripts]
fp-start = "main:run"
fp-test-api = "test_api:run_tests"
fp-init-db = "app.database:init_db"

[tool.setuptools]
packages = ["app", "app.routers", "app.utils"]

