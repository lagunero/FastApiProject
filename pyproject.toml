[project]
name = "fastapiproject"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "pydantic>=2.10,<3",
    "pydantic-settings==2.5.0",
    "python-jose[cryptography]==3.3.0",
    "sqlalchemy>=2.0.27,<3",
]

# PEP 621: expose simple console entry points for common tasks
[project.scripts]
fp-start = "main:run"
fp-test-api = "test_api:run_tests"
fp-init-db = "app.database:init_db"

